:root[data-theme="dark"]{--bg:#0E1920;--sf:#16252E;--ink:#E6EEF2;--mut:#8DA3B0;--ln:#263842;--ac:#2FC4B4;--acs:#14403B;--p:#2FC4B4;--h:#7BA3FF;--x:#F0A945;color-scheme:dark}

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cg small{font-size:11px;color:var(--mut);font-weight:700}
.cd{height:40px;border-radius:10px;font-weight:600}.cd.td{border:1.5px solid var(--ac)}.cd.on{background:var(--ac);color:var(--bg)}.cd:disabled{opacity:.3}

<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],WK=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'],WO=[6,0,1,2,3,4,5];
const MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const CAT={p:['الصيدلية','💊'],h:['المستشفى','🏥'],x:['شخصي','🚗']};
const NAV=[['home','📋','ورايا إيه'],['rout','🔁','الروتين'],['upc','📅','القادم'],['links','🔗','لينكاتي']],TTL={rout:'الروتين',upc:'القادم',links:'لينكاتي'};
const PRE=[['واتساب','whatsapp://send'],['المنبه','intent:#Intent;action=android.intent.action.SHOW_ALARMS;end'],['الآلة الحاسبة','https://www.google.com/search?q=calculator'],['الخرائط','https://maps.google.com'],['الملاحظات','https://keep.google.com']];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r},parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const N=n=>Number(n).toLocaleString('ar-EG'),TD=()=>ymd(new Date()),BK=()=>ymd(add(new Date(),1));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tf=m=>{const h=Math.floor(m/60),i=m%60;return N(h%12||12)+':'+(i<10?'٠':'')+N(i)+' '+(h<12?'ص':'م')};
const dl=s=>{const d=parse(s);return DAYS[d.getDay()]+' '+N(d.getDate())+' '+MON[d.getMonth()]};
const sz=b=>b<1048576?N(Math.max(1,Math.round(b/1024)))+' ك.ب':N((b/1048576).toFixed(1))+' م.ب';
let S={tasks:[],routines:[],links:[],shortcuts:[],gen:[]},scr='home',flt='all',sub='d',lf='all',q='',M,R,L,cal,tmr;
try{Object.assign(S,JSON.parse(localStorage.getItem('wraya')||'{}'))}catch(e){}
// Cross-device persistence. Only the publishable key belongs in this file.
const API='https://auphezrpibtgdmzptzly.supabase.co', KEY='sb_publishable_9Bek6ZW4peN7oNOreQPBpA_Qts4i6CE';
let session=null,baseline={},pending={},syncBusy=false,cloudReady=false,statusText='سجّل دخولك للمزامنة';
const emptyState=()=>({tasks:[],routines:[],links:[],shortcuts:[],gen:[]});
const kinds=['tasks','routines','links','shortcuts'];
const cacheKey=()=>session?'wraya-user-'+session.user.id:null;
const records=()=>Object.fromEntries(kinds.flatMap(k=>(S[k]||[]).map(x=>[k+'|'+x.id,{kind:k,id:x.id,data:x}])));
function syncStatus(t){statusText=t;const e=document.getElementById('cloud-status');if(e)e.textContent=t;}
const lsv=()=>{try{if(cacheKey())localStorage.setItem(cacheKey(),JSON.stringify({state:S,pending}));else localStorage.setItem('wraya',JSON.stringify(S));}catch(e){syncStatus('مساحة الجهاز غير كافية للحفظ المحلي');}};
function save(){if(session&&!cloudReady)return;const next=records();if(session){for(const [k,r] of Object.entries(next))if(!baseline[k]||JSON.stringify(baseline[k].data)!==JSON.stringify(r.data))pending[k]={...r,deleted:false};for(const [k,r] of Object.entries(baseline))if(!next[k])pending[k]={...r,data:{},deleted:true};baseline=JSON.parse(JSON.stringify(next));}lsv();if(session){syncStatus('تغييرات على الجهاز، جاري المزامنة');clearTimeout(wt);wt=setTimeout(push,500);}}
let wt;
async function req(path,opts={}){const h={apikey:KEY,...opts.headers};if(session)h.Authorization='Bearer '+session.access_token;const r=await fetch(API+path,{...opts,headers:h});if(!r.ok){const text=await r.text();let msg;try{msg=JSON.parse(text).msg||JSON.parse(text).message}catch{}throw new Error(msg||'تعذر الاتصال ('+r.status+')');}const text=await r.text();return text?JSON.parse(text):null;}
async function refreshSession(){if(!session)return;if(session.expires_at>Date.now()/1000+90)return;const d=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});session=d;localStorage.setItem('wraya-session',JSON.stringify(d));}
async function push(){if(!session||!cloudReady||syncBusy)return;syncBusy=true;try{await refreshSession();const batch=JSON.parse(JSON.stringify(pending)),rows=Object.values(batch).map(r=>({...r,user_id:session.user.id,updated_at:new Date().toISOString()}));if(rows.length){await req('/rest/v1/wraya_records?on_conflict=user_id,kind,id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});for(const [k,v] of Object.entries(batch))if(JSON.stringify(pending[k])===JSON.stringify(v))delete pending[k];lsv();}await pullCloud();syncStatus(Object.keys(pending).length?'في تغييرات لسه ما اترفعتش':'محفوظ على حسابك');}catch(e){syncStatus('لم تتم المزامنة، بياناتك على الجهاز. جرّب تاني');}finally{syncBusy=false;}}
async function pullCloud(){const rows=await req('/rest/v1/wraya_records?select=kind,id,data,deleted&user_id=eq.'+session.user.id);const map={};for(const r of rows)if(!r.deleted)map[r.kind+'|'+r.id]=r;for(const [k,r] of Object.entries(pending)){if(r.deleted)delete map[k];else map[k]=r;}S=emptyState();for(const r of Object.values(map))if(kinds.includes(r.kind))S[r.kind].push(r.data);S.gen=S.tasks.filter(x=>x.rid&&x.occ).map(x=>x.rid+'|'+x.occ);baseline=JSON.parse(JSON.stringify(records()));lsv();render();}
async function pull(){if(!session||syncBusy||!cloudReady)return;await push();}
function account(){sheet(`<h3>حسابك والمزامنة</h3><p id="auth-message" role="status"></p>${session?`<p>${esc(session.user.email)}</p><p>${esc(statusText)}</p><button class="pri" onclick="push()">مزامنة الآن</button><button class="chip" onclick="importLocal()">استيراد بيانات المتصفح القديمة</button><p class="sub">الاستيراد اختياري من نفس الجهاز اللي عليه البيانات القديمة. الملفات المحلية تحتاج إعادة رفعها.</p><button class="chip" onclick="passwordForm()">تغيير كلمة المرور</button><button class="chip" onclick="logout()">تسجيل خروج</button>`:`<label for="auth-email">الإيميل</label><input id="auth-email" class="in" type="email" autocomplete="username" dir="ltr"><label for="auth-pass">كلمة المرور</label><input id="auth-pass" class="in" type="password" autocomplete="current-password" dir="ltr" minlength="8"><button id="auth-login" class="pri" onclick="login(false)">تسجيل الدخول</button><button id="auth-signup" class="chip" onclick="login(true)">حساب جديد</button><p class="sub">نسخة تجريبية: لا يوجد تأكيد إيميل أو استرجاع كلمة مرور بالبريد حالياً. احتفظ بكلمة مرورك واستخدم إيميلك الحقيقي.</p><p class="sub">كل حساب له مهامه وملفاته الخاصة. لا تستخدم كلمة مرور بريدك هنا.</p>`}`);}
function passwordForm(){if(!session)return account();sheet(`<h3>تغيير كلمة المرور</h3><p>الحساب: ${esc(session.user.email)}</p><p id="password-message" role="status"></p><label for="new-password">كلمة المرور الجديدة</label><input id="new-password" class="in" type="password" autocomplete="new-password" dir="ltr" minlength="8"><label for="confirm-password">تأكيد كلمة المرور</label><input id="confirm-password" class="in" type="password" autocomplete="new-password" dir="ltr" minlength="8"><p class="sub">8 حروف على الأقل. لا تستخدم كلمة مرور بريدك.</p><button id="save-password" class="pri" onclick="changePassword()">حفظ كلمة المرور</button>`);}
async function changePassword(){if(!session)return;const p=$('#new-password').value,c=$('#confirm-password').value,m=$('#password-message'),b=$('#save-password');if(p.length<8){m.textContent='كلمة المرور لازم تكون 8 حروف على الأقل';return;}if(p!==c){m.textContent='الكلمتان غير متطابقتين';return;}b.disabled=true;try{await refreshSession();const user=await req('/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});session.user=user;localStorage.setItem('wraya-session',JSON.stringify(session));$('#new-password').value=$('#confirm-password').value='';m.textContent='تم تغيير كلمة المرور بنجاح';toast('تم تغيير كلمة المرور');}catch(e){m.textContent='لم يتم تغيير كلمة المرور. جرّب كلمة مختلفة واتأكد من الاتصال.';}finally{b.disabled=false;}}
async function login(signup){const e=$('#auth-email').value.trim(),p=$('#auth-pass').value;if(!e||p.length<8){$('#auth-message').textContent='اكتب إيميل صحيح وكلمة مرور 8 حروف على الأقل';return;}$('#auth-login').disabled=$('#auth-signup').disabled=true;try{const d=await req(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});if(!d.access_token){$('#auth-message').textContent='راجع بريدك لتأكيد الحساب قبل الدخول. لو الرسالة ما وصلتش، تواصل مع صاحب الموقع.';return;}session=d;localStorage.setItem('wraya-session',JSON.stringify(d));await activate();closeS();toast('تم تسجيل الدخول');}catch(err){$('#auth-message').textContent=signup?'تعذر التسجيل. راجع الإيميل وكلمة المرور أو تواصل مع صاحب الموقع.':'تعذر الدخول. راجع البيانات والاتصال وتأكيد البريد.';}finally{if($('#auth-login'))$('#auth-login').disabled=$('#auth-signup').disabled=false;}}
async function activate(){cloudReady=false;S=emptyState();pending={};try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(c){S={...emptyState(),...c.state};pending=c.pending||{};}}catch{}baseline=JSON.parse(JSON.stringify(records()));render();try{await refreshSession();await pullCloud();cloudReady=true;sync();await push();}catch(e){cloudReady=true;syncStatus('لا يمكن الوصول للحساب الآن، التغييرات على الجهاز فقط');}}
function logout(){if(Object.keys(pending).length&&!confirm('في تغييرات لسه ما اترفعتش. تخرج؟ هتفضل محفوظة على الجهاز لهذا الحساب.'))return;session=null;cloudReady=false;pending={};baseline={};localStorage.removeItem('wraya-session');S=emptyState();render();closeS();syncStatus('سجّل دخولك للمزامنة');}
async function resetPassword(){const email=$('#auth-email').value.trim();if(!email)return $('#auth-message').textContent='اكتب إيميلك الأول';try{await req('/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});$('#auth-message').textContent='لو الحساب موجود وخدمة البريد مفعلة، هتوصلك رسالة استرجاع. لو ما وصلتش تواصل مع صاحب الموقع.';}catch(e){$('#auth-message').textContent='خدمة الاسترجاع غير متاحة حالياً. تواصل مع صاحب الموقع.';}}
async function importLocal(){if(!session)return;let old;try{old=JSON.parse(localStorage.getItem('wraya')||'null')}catch{}if(!old)return toast('مفيش بيانات قديمة على المتصفح ده');if(!confirm('تضيف المهام والروتين والروابط القديمة لحسابك الحالي؟ الملفات القديمة تحتاج إعادة رفعها.'))return;for(const k of kinds)for(const x of old[k]||[])if(!(k==='links'&&x.k==='f')&&!S[k].some(y=>y.id===x.id))S[k].push(x);save();sync();closeS();render();await push();}

const root=document.documentElement;let th;try{th=localStorage.getItem('wraya-th')}catch(e){}
root.dataset.theme=th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');

const idb=new Promise(r=>{try{const o=indexedDB.open('wraya',1);o.onupgradeneeded=()=>o.result.createObjectStore('f',{keyPath:'id'});o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});

const chip=(l,on,a)=>`<button class="chip${on?' on':''}" onclick="${a}">${l}</button>`;
const emp=(a,b='')=>`<div class="emp"><b>${a}</b>${b}</div>`;

return l.length?l.map(x=>x.k==='f'?`<div class="tk" style="--cc:var(--h)"><div class="tb"><div class="tt">📊 ${esc(x.n)}</div><div class="tm"><span>${sz(x.sz)}</span></div></div><button class="lk" onclick="fo('${x.id}')">فتح</button><button class="dl" onclick="ldel('${x.id}')" aria-label="حذف">✕</button></div>`:
`<div class="tk" style="--cc:var(--${x.c})"><div class="tb"><a class="tt" href="${esc(shortcutHref(x.u))}" target="${isWA(x.u)?'_self':'_blank'}" rel="noopener noreferrer">🔗 ${esc(x.n)}</a><div class="tm"><span>${CAT[x.c][1]} ${CAT[x.c][0]}</span></div></div><a class="lk" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">فتح</a><button class="dl" onclick="ldel('${x.id}')" aria-label="حذف">✕</button></div>`).join(''):emp('مفيش نتائج','أضف رابط بزر + أو ارفع شيت من «رفع ملف»')}
function links(){return`<input class="in" type="search" placeholder="ابحث في الروابط والملفات" value="${esc(q)}" oninput="q=this.value;$('#ll').innerHTML=ll()"><div class="fl">${[['all','الكل'],['f','📊 شيتات وملفات'],['l','🔗 روابط']].map(c=>chip(c[1],lf===c[0],`lf='${c[0]}';render()`)).join('')}<button class="chip" onclick="$('#fi').click()">⬆ رفع ملف</button></div><div id="ll">${ll()}</div>`}
async function ldel(id){const f=S.links.find(x=>x.id===id);if(f&&f.k==='f'&&f.path){try{await refreshSession();await req('/storage/v1/object/wraya-files',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefixes:[f.path]})});}catch(e){return toast('تعذر حذف الملف، جرّب تاني');}}S.links=S.links.filter(x=>x.id!==id);save();render();}
async function upl(i){if(!session){i.value='';account();return;}let n=0;for(const f of i.files){if(f.size>52428800){toast('حد الملف 50 ميجا');continue;}const id=crypto.randomUUID(),path=session.user.id+'/'+id;try{await refreshSession();await req('/storage/v1/object/wraya-files/'+path,{method:'POST',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});S.links.push({id,k:'f',n:f.name,sz:f.size,path});save();n++;}catch(e){toast('فشل رفع '+f.name);}}i.value='';render();toast(n?'اترفع '+N(n)+' ملف':'لم يتم رفع ملفات');}
async function fo(id){const f=S.links.find(x=>x.id===id);if(!f.path)return toast('الملف قديم على الجهاز الأصلي، أعد رفعه');try{await refreshSession();const d=await req('/storage/v1/object/sign/wraya-files/'+f.path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expiresIn:60})});const a=document.createElement('a');a.href=API+'/storage/v1'+d.signedURL;a.target='_blank';a.rel='noopener';a.download=f.n;a.click();}catch(e){toast('تعذر فتح الملف');}}
function addL(){L={n:'',u:'',c:'p'};lsheet()}
function lsheet(){sheet(`<h3>رابط جديد</h3><input class="in" placeholder="الاسم" maxlength="80" value="${esc(L.n)}" oninput="L.n=this.value"><input class="in" type="url" dir="ltr" placeholder="https://..." value="${esc(L.u)}" oninput="L.u=this.value"><div class="lb">التصنيف</div><div class="chs">${['p','h','x'].map(c=>chip(CAT[c][1]+' '+CAT[c][0],L.c===c,`L.c='${c}';lsheet()`)).join('')}</div><button class="pri" onclick="saveL()">حفظ الرابط</button>`)}
function saveL(){const u=lurl(L.u);if(!u)return toast('اكتب رابط صحيح');let n=L.n.trim();if(!n){try{n=new URL(u).hostname}catch(e){n=u}}S.links.push({id:uid(),k:'l',n,u,c:L.c});save();closeS();if(scr==='links')render();toast('اتحفظ')}
const waParse=u=>{try{const x=new URL(u.trim());if(x.protocol==='whatsapp:')return {p:x.searchParams.get('phone')||'',t:x.searchParams.get('text')||''};if(!/^https?:$/.test(x.protocol))return null;const h=x.hostname.replace(/^(www|api|web)\./,'');if(h==='wa.me')return {p:x.pathname.replace(/\D/g,''),t:x.searchParams.get('text')||''};if(h==='whatsapp.com'&&/^\/(?:send\/?|mobile\/?|)$/.test(x.pathname))return {p:x.searchParams.get('phone')||'',t:x.searchParams.get('text')||''};}catch(e){}return null};const isWA=u=>!!waParse(u);const shortcutHref=u=>{const w=waParse(u);if(!w)return u;if(!w.p&&!w.t)return /Android/i.test(navigator.userAgent)?'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.whatsapp;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.whatsapp')+';end':'whatsapp://';const q=(w.p?'phone='+encodeURIComponent(w.p):'')+(w.t?(w.p?'&':'')+'text='+encodeURIComponent(w.t):'');return /Android/i.test(navigator.userAgent)?'intent://send/'+(q?'?'+q:'')+'#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url='+encodeURIComponent('https://wa.me/'+(w.p||''))+';end':'whatsapp://send'+(q?'?'+q:'')};
const VER='2026-11-23.6';const waQ=u=>{const w=waParse(u)||{p:'',t:''};return (w.p?'?phone='+encodeURIComponent(w.p):'')+(w.t?(w.p?'&':'?')+'text='+encodeURIComponent(w.t):'')};const openWA=q=>{if(!/Android/i.test(navigator.userAgent)){location.href='whatsapp://send'+q;return}let done=false;const stop=()=>{done=true};document.addEventListener('visibilitychange',stop,{once:true});addEventListener('pagehide',stop,{once:true});const step=(u,next)=>{if(done)return;location.href=u;setTimeout(()=>{if(done||document.hidden)return;next()},1200)};step('intent://send/'+q+'#Intent;scheme=whatsapp;end',()=>step('intent://send/'+q+'#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end',()=>step('intent://send/'+q+'#Intent;scheme=whatsapp;package=com.whatsapp;end',()=>{toast('مش لاقي واتساب على الموبايل');setTimeout(()=>{if(!done)location.href='https://play.google.com/store/apps/details?id=com.whatsapp'},1500)})))};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a||a.dataset.web)return;if(a.dataset.app){e.preventDefault();openWA(a.dataset.q||'');return}const h=a.getAttribute('href')||'';const w=shortcutHref(h);if(w!==h){e.preventDefault();location.href=w}},true);fetch(location.pathname+'?c='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(x=>{const m=x.match(/const VER='([^']+)'/);if(m&&m[1]!==VER&&!sessionStorage.getItem('vr')){sessionStorage.setItem('vr','1');location.replace(location.pathname+'?v='+m[1])}}).catch(()=>{});
function shortcuts(){sheet(`<h3>اختصاراتي</h3>`+(S.shortcuts.length?S.shortcuts.map(s=>`<div class="tk" style="--cc:var(--ac)"><div class="tb">${isWA(s.u)?`<span class="tt">${esc(s.n)}</span><a class="lk" data-app="1" data-q="${esc(waQ(s.u))}" href="${esc(shortcutHref(s.u))}" target="_self" rel="noopener noreferrer">فتح واتساب</a><a data-web="1" href="https://web.whatsapp.com/" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:var(--mut);margin-top:8px;display:block">واتساب ويب (للكمبيوتر)</a>`:`<a class="tt" href="${esc(shortcutHref(s.u))}" target="_blank" rel="noopener noreferrer">${esc(s.n)}</a>`}</div><button class="dl" onclick="sdel('${s.id}')" aria-label="حذف">✕</button></div>`).join(''):emp('مفيش اختصارات','اضغط «إضافة» واختار تطبيق'))+`<button class="pri" onclick="sadd()">إضافة</button><div class="lb" dir="ltr">v${VER}</div>`)}
const sdel=id=>{S.shortcuts=S.shortcuts.filter(s=>s.id!==id);save();shortcuts()};
function sadd(){L={n:'',u:''};sheet(`<h3>إضافة اختصار</h3><div class="chs">${PRE.map((p,i)=>chip(p[0],S.shortcuts.some(s=>s.n===p[0]),`spre(${i})`)).join('')}</div><div class="lb">أو رابط مخصص</div><input class="in" placeholder="الاسم" maxlength="40" oninput="L.n=this.value"><input class="in" dir="ltr" placeholder="https://... أو whatsapp://" oninput="L.u=this.value"><button class="pri" onclick="scus()">حفظ</button>`)}
function spre(i){if(!S.shortcuts.some(s=>s.n===PRE[i][0]))S.shortcuts.push({id:uid(),n:PRE[i][0],u:PRE[i][1]});save();shortcuts()}
function scus(){const u=lurl(L.u),n=L.n.trim();if(!n||!u)return toast('اكتب الاسم والرابط');S.shortcuts.push({id:uid(),n,u});save();shortcuts()}
function fab(){if(!session)return account();if(!cloudReady)return toast('استنى المزامنة الأول');scr==='rout'?addR():scr==='links'?addL():addT()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();render();pull()}});
render();
(async()=>{try{session=JSON.parse(localStorage.getItem('wraya-session')||'null');if(session?.access_token)await activate();else{S=emptyState();render();account();}}catch(e){syncStatus('تعذر فتح الحساب. أعد تسجيل الدخول');}})();
window.addEventListener('online',()=>push());
</script>
